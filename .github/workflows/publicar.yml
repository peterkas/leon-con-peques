# Valida los datos, genera los .ics y publica la web en GitHub Pages.
# Si la validación o la prueba de humo fallan, no se publica nada (sigue la versión anterior).
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar datos, generar .ics y prueba de humo
        run: ./tools/test.sh "$(TZ=Europe/Madrid date +%F)"

      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html data.js lib.js sw.js manifest.webmanifest .nojekyll icons ics _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Si los datos publicados son recientes, cierra el recordatorio de actualización.
  close-reminder:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Cerrar recordatorio si los datos son de esta semana
        run: |
          UPDATED=$(sed -n "s/^const UPDATED *= *'\([0-9-]*\)'.*/\1/p" data.js)
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$UPDATED" +%s) ) / 86400 ))
          if [ "$DAYS" -lt 8 ]; then
            for n in $(gh issue list --label actualizacion --state open --json number -q '.[].number'); do
              gh issue close "$n" --comment "Datos actualizados el $UPDATED y publicados. ✅"
            done
          fi
